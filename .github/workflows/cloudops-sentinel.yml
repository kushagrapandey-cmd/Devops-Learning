name: CloudOps Sentinel
on:
  push:
    paths: ['projects/cloudops-sentinel/**', '.github/workflows/cloudops-sentinel.yml']
  pull_request:
    paths: ['projects/cloudops-sentinel/**', '.github/workflows/cloudops-sentinel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/cloudops-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and HTTP integration tests
        run: bash scripts/verify.sh
      - name: Browser model tests
        run: node --test tests/*.test.mjs
      - name: ShellCheck
        run: shellcheck scripts/*.sh azure/*.sh linux/*.sh azure/linux-vm/*.sh
      - name: Compile Azure VM Bicep
        run: az bicep build --file azure/linux-vm/main.bicep --outfile /tmp/sentinel-linux-arm.json
      - name: Real systemd install and recovery
        run: |
          sudo bash linux/install.sh --install-dedicated-lab
          sudo systemctl stop sentinel
          if curl -fsS http://127.0.0.1:8080/healthz; then exit 1; fi
          sudo systemctl start sentinel
          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8080/healthz
          sudo bash linux/config-backup.sh backup
          backup=$(sudo find /var/backups/sentinel-lab -type f -name "app.env.*" | head -1)
          sudo sed -i "s/PORT=8080/PORT=9090/" /etc/sentinel-lab/app.env
          sudo systemctl restart sentinel
          sudo bash linux/config-backup.sh restore "$backup" --restore-lab-config
          bash linux/patch.sh plan
          sudo systemctl stop sentinel
      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Build and deploy to real local Kubernetes
        run: bash scripts/local-cluster.sh
      - name: Smoke test through the Service
        run: |
          kubectl -n sentinel port-forward svc/sentinel 8080:80 > /tmp/forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8080/readyz
          curl --fail http://127.0.0.1:8080/api/status
      - name: Recovery and rollback drills
        run: bash scripts/drills.sh
      - name: Save cluster evidence
        if: always()
        run: |
          mkdir -p reports
          kubectl -n sentinel get pods,deploy,svc -o wide > reports/cluster.txt 2>&1 || true
          kubectl -n sentinel get events --sort-by=.lastTimestamp > reports/events.txt 2>&1 || true
          kubectl -n sentinel logs -l app=sentinel --tail=100 --prefix > reports/app.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-cluster-evidence
          path: projects/cloudops-sentinel/reports
          retention-days: 7
